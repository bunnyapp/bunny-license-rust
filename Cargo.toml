[package]
name = "bunnyapp-license"
version = "0.1.2"
edition = "2021"
description = "License validation SDK for Bunny subscriptions"
license = "MIT"
repository = "https://github.com/bunnyapp/bunny-license-rust"
homepage = "https://github.com/bunnyapp/bunny-license-rust"
documentation = "https://docs.rs/bunnyapp-license"
readme = "README.md"
keywords = ["license", "licensing", "jwt", "sdk"]
categories = ["authentication", "api-bindings"]

[dependencies]
jsonwebtoken = "9"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
wiremock = "0.6"
serial_test = "3"
